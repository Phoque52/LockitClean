# Builds LockitClean.dmg on GitHub's Macs and attaches it to a Release.
# Runs automatically when you publish a release with a tag like v1.0.0,
# or manually from the Actions tab ("Run workflow") for an existing tag.
name: Build DMG

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the DMG to (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app + DMG
        run: bash build.sh
      - name: Upload DMG to the Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: build/LockitClean.dmg
