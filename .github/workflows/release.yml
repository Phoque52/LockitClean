# Builds LockitClean.dmg on GitHub's Macs and attaches it to a Release
# whenever you push a version tag like v1.0.0.
name: Build DMG

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app + DMG
        run: ./build.sh
      - name: Upload DMG to the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/LockitClean.dmg
      - name: Keep DMG as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LockitClean-dmg
          path: build/LockitClean.dmg
